# Render blueprint for the backend. It uses Docker because the video worker needs ffmpeg,
# which the plain Node runtime does not have. Free plan: one process, so the workers run inside it.
services:
  - type: web
    name: streamlearn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: INLINE_WORKERS
        value: 'true'
      - key: EMAIL_DRIVER
        value: console
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: us-east-005
      - key: TRANSCODE_MAX_HEIGHT
        value: '720'
      - key: FFMPEG_PRESET
        value: veryfast
      - key: TEMP_UPLOAD_PATH
        value: /tmp/uploads/temp
      - key: HLS_OUTPUT_PATH
        value: /tmp/uploads/hls
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: STREAM_BASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
