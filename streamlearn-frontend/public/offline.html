<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — StreamLearn</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #141414; color: #fff; font-family: Inter, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; text-align: center; }
    .logo { font-size: 2rem; font-weight: 900; margin-bottom: 2rem; }
    .logo span:first-child { color: #e50914; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #b3b3b3; margin-bottom: 2rem; }
    button { background: #e50914; color: #fff; border: none; padding: 12px 32px;
      border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #b20710; }
  </style>
</head>
<body>
  <div class="logo"><span>STREAM</span><span>LEARN</span></div>
  <div style="font-size:4rem;margin-bottom:1.5rem">📡</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again.<br>Downloaded content is still available.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
